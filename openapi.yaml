      summary: List battle log
      description: Returns battle history for the authenticated user.
      operationId: listBattleLog
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Battle log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/user/update:
    post:
      tags:
        - Account & Profile
      summary: Update user information
      description: Updates information for the authenticated user.
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Updated user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/user/leave:
    post:
      tags:
        - Account & Profile
      summary: Delete account
      description: Deletes or deactivates the authenticated user's account.
      operationId: deleteAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/ticket/start:
    post:
      tags:
        - Matchmaking
      summary: Start matchmaking ticket
      description: Starts a matchmaking ticket for the authenticated player.
      operationId: startMatchmakingTicket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Matchmaking ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/ticket/stop:
    post:
      tags:
        - Matchmaking
      summary: Stop matchmaking ticket
      description: Stops the authenticated player's active matchmaking ticket.
      operationId: stopMatchmakingTicket
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Ticket cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/ticket/describe:
    get:
      tags:
        - Matchmaking
      summary: Get ticket status
      description: Returns the authenticated player's current matchmaking ticket status.
      operationId: describeMatchmakingTicket
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Matchmaking ticket status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/allocation/describe:
    get:
      tags:
        - Matchmaking
      summary: Get allocation status
      description: Returns allocation status for the authenticated player.
      operationId: describeAllocation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Allocation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/session/connection:
    get:
      tags:
        - Matchmaking
      summary: Get session connection information
      description: Returns connection details for the allocated game session.
      operationId: getSessionConnection
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session connection information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/player/update_latency:
    post:
      tags:
        - Matchmaking
      summary: Update player latency
      description: Updates the authenticated player's reported network latency.
      operationId: updatePlayerLatency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Latency update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/practice/allocate:
    post:
      tags:
        - Matchmaking
      summary: Allocate practice match
      description: Allocates a practice match for the authenticated player.
      operationId: allocatePracticeMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Practice match allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/competitive/allocate:
    post:
      tags:
        - Matchmaking
      summary: Allocate competitive match
      description: Allocates a competitive match for the authenticated player.
      operationId: allocateCompetitiveMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Competitive match allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_room/create:
    post:
      tags:
        - Lobby & Bands
      summary: Create a band room
      description: Creates a band room for the authenticated player.
      operationId: createBandRoom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Created band room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_room/join:
