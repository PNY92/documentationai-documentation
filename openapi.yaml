        default:
          $ref: '#/components/responses/DefaultError'
  /system/game_session/v1/battle/start:
    post:
      tags:
        - System
      summary: Report battle start
      description: Reports the start of a game session battle.
      operationId: reportBattleStart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
