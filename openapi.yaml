openapi: '3.0.0'
info:
  version: 1.0.0
  title: SMASH LEGENDS Private Server API
  description: >
    HTTP API for the SMASH LEGENDS private server. Handles authentication,
    profiles, matchmaking, lobby management, and admin operations.
  license:
    name: MIT
servers:
  - url: http://localhost:18080
    description: Local private server
tags:
  - name: Bootstrap
    description: Health, master data, feature flags, and assets
  - name: Account & Profile
    description: Sign-up, sign-in, profiles, and preferences
  - name: Matchmaking
    description: Matchmaking tickets, allocation, and session connections
  - name: Lobby & Bands
    description: Room management, member state, and band matches
  - name: Tutorial
    description: Tutorial lists and reward claims
  - name: Admin
    description: Server management endpoints restricted to loopback clients
  - name: System
    description: Match results and rewards
paths:
  /health:
    get:
      tags:
        - Bootstrap
      summary: Get server health
      description: Returns server time, stage, schema version, uptime, and health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /master/{category}/{version}/metadata.bin:
    get:
      tags:
        - Bootstrap
      summary: Get master data
      description: Returns binary master data for the requested category and version.
      operationId: getMasterMetadata
      security: []
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Binary master data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/DefaultError'
  /evaluation/batch:
    post:
      tags:
        - Bootstrap
      summary: Evaluate feature flags in batch
      description: Evaluates multiple feature flags for a client context.
      operationId: evaluateFeatureFlagsBatch
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Feature flag evaluation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /evaluation:
    post:
      tags:
        - Bootstrap
      summary: Evaluate a feature flag
      description: Evaluates a single feature flag for a client context.
      operationId: evaluateFeatureFlag
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Feature flag evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /asset/{version}/{platform}/version.json:
    get:
      tags:
        - Bootstrap
      summary: Get asset bundle manifest
      description: Returns the asset bundle manifest for a version and platform.
      operationId: getAssetManifest
      security: []
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: Asset bundle manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/resource/version:
    get:
      tags:
        - Bootstrap
      summary: Get resource version
      description: Returns the current public resource version.
      operationId: getResourceVersion
      security: []
      responses:
        '200':
          description: Resource version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_up/gamepot:
    post:
      tags:
        - Account & Profile
      summary: Sign up with GamePot
      description: Creates an account using GamePot provider credentials.
      operationId: signUpWithGamePot
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_in/gamepot:
    post:
      tags:
        - Account & Profile
      summary: Sign in with GamePot
      description: Authenticates an account using GamePot provider credentials.
      operationId: signInWithGamePot
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_up/steam:
    post:
      tags:
        - Account & Profile
      summary: Sign up with Steam
      description: Creates an account using Steam credentials.
      operationId: signUpWithSteam
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_in/steam:
    post:
      tags:
        - Account & Profile
      summary: Sign in with Steam
      description: Authenticates an account using Steam credentials.
      operationId: signInWithSteam
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_up/dev:
    post:
      tags:
        - Account & Profile
      summary: Sign up with dev provider
      description: Creates a development account using development credentials.
      operationId: signUpWithDev
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api_public/v1/account/sign_in/dev:
    post:
      tags:
        - Account & Profile
      summary: Sign in with dev provider
      description: Authenticates a development account.
      operationId: signInWithDev
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/me/initial/full:
    get:
      tags:
        - Account & Profile
      summary: Get full profile
      description: Returns the authenticated user's complete initial profile data.
      operationId: getFullProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Full profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/me/battle:
    get:
      tags:
        - Account & Profile
      summary: Get battle profile
      description: Returns battle-related profile information for the authenticated user.
      operationId: getBattleProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Battle profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/me/shop:
    post:
      tags:
        - Account & Profile
      summary: Submit shop request
      description: Processes a shop request for the authenticated user.
      operationId: submitShopRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Shop request result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/preference:
    get:
      tags:
        - Account & Profile
      summary: Get preferences
      description: Returns preferences for the authenticated user.
      operationId: getPreferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - Account & Profile
      summary: Set preferences
      description: Updates preferences for the authenticated user.
      operationId: setPreferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/character/list:
    get:
      tags:
        - Account & Profile
      summary: List characters
      description: Returns characters owned by the authenticated user.
      operationId: listCharacters
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Character list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/inventory/initial:
    get:
      tags:
        - Account & Profile
      summary: Get initial inventory
      description: Returns the authenticated user's initial inventory data.
      operationId: getInitialInventory
      security:
        - BearerAuth: []
      responses:
        '200':
