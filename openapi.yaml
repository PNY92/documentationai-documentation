      summary: Join a band room
      description: Joins the authenticated player to a band room.
      operationId: joinBandRoom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Joined band room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_room/leave:
    post:
      tags:
        - Lobby & Bands
      summary: Leave a band room
      description: Removes the authenticated player from the current band room.
      operationId: leaveBandRoom
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Band room leave result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_room/kick:
    post:
      tags:
        - Lobby & Bands
      summary: Kick a band member
      description: Removes a member from the current band room.
      operationId: kickBandMember
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Member kick result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
