  /api/v1/band_match/start:
    post:
      tags:
        - Lobby & Bands
      summary: Start band match
      description: Starts a match for the current band.
      operationId: startBandMatch
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Band match start result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_match/stop:
    post:
      tags:
        - Lobby & Bands
      summary: Stop band match
      description: Stops the current band match.
      operationId: stopBandMatch
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Band match stop result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band/current:
    get:
      tags:
        - Lobby & Bands
      summary: Get current band
      description: Returns the current band and member state for the authenticated player.
      operationId: getCurrentBand
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current band
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/band_chat/send_text:
    post:
      tags:
        - Lobby & Bands
      summary: Send band chat text
      description: Sends a text message to the current band.
      operationId: sendBandChatText
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        '200':
          description: Chat message result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/tutorial/list:
    get:
      tags:
        - Tutorial
      summary: Get tutorial list
      description: Returns tutorials available to the authenticated player.
      operationId: getTutorialList
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tutorial list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/tutorial/battle_claim:
    post:
      tags:
