components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT Bearer token
  parameters:
    Category:
      name: category
      in: path
      required: true
      description: Master data category.
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      description: Resource or asset version.
      schema:
        type: string
    Platform:
      name: platform
      in: path
      required: true
      description: Client platform.
      schema:
        type: string
  responses:
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - serverTime
        - stage
        - schemaVersion
        - uptime
        - ok
      properties:
        serverTime:
          type: string
          description: Current server time.
          example: '2024-01-01T00:00:00Z'
        stage:
          type: string
          description: Deployment stage.
          example: local
        schemaVersion:
          type: integer
          description: API schema version.
          example: 1
        uptime:
          type: string
          description: Server uptime.
          example: 2h15m30s
        ok:
          type: boolean
          description: Whether the server is healthy.
          example: true
    SignInRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Provider account identifier.
          example: player-123
        provider:
          type: string
          description: Authentication provider.
          example: gamepot
        gamepotToken:
          type: string
          description: GamePot provider token.
        steamId:
          type: string
          description: Steam account identifier.
        devId:
          type: string
          description: Development account identifier.
        nickname:
          type: string
          description: Optional requested nickname.
    SignInResponse:
      type: object
      required:
        - token
        - accountId
        - whiteNid
      properties:
        token:
          type: string
          description: JWT access token.
          example: eyJhbGciOiJIUzI1NiJ9.example
        accountId:
          type: string
          description: Account identifier.
          example: account-123
        whiteNid:
          type: boolean
          description: Whether the account is allowlisted.
          example: false
    TicketResponse:
      type: object
      required:
        - ticketId
        - state
      properties:
        ticketId:
          type: string
          description: Matchmaking ticket identifier.
          example: ticket-123
        state:
          type: string
          description: Current matchmaking state.
          enum:
            - queued
            - searching
            - matching
            - placing
            - activating
            - completed
            - failed
            - timedout
            - cancelled
          example: searching
        ipAddress:
          type: string
          description: Allocated match server IP address.
          example: 127.0.0.1
        port:
          type: integer
          description: Allocated match server port.
          example: 19000
    MatchResult:
      type: object
      required:
        - matchId
        - result
        - rewards
      properties:
        matchId:
          type: string
          description: Match identifier.
          example: match-123
        result:
          type: string
          description: Match result.
          example: victory
        rewards:
          type: object
          description: Rewards granted for the match.
          additionalProperties: true
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Application error code.
          example: 400
        message:
          type: string
          description: Human-readable error message.
          example: Invalid request
    GenericRequest:
      type: object
      description: Flexible request payload for endpoint-specific fields.
      additionalProperties: true
    GenericResponse:
      type: object
      description: Flexible response payload for endpoint-specific data.
      additionalProperties: true